name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    uses: nodejs/web-team/.github/workflows/codeql.yml@bb854ae62671e06aeeb24e8ef45be1e3a404f89d
    permissions:
      actions: read
      contents: read
      security-events: write
